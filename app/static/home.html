<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心流 · 选择角色</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="home-container">
    <h1 class="home-title">✨ AI 虚拟陪伴 ✨</h1>
    <p class="home-subtitle">选择一位角色，开启属于你们的温暖对话</p>
    <div class="role-cards">
      <div class="role-card" data-role="日系动漫型"><div class="card-avatar avatar-sakura">🌸</div><div class="card-info"><div class="card-name">🌸 小樱</div><div class="card-desc">二次元少女，精通动漫</div></div></div>
      <div class="role-card" data-role="高冷御姐型"><div class="card-avatar avatar-yukino">❄️</div><div class="card-info"><div class="card-name">❄️ 雪乃</div><div class="card-desc">成熟冷静的职场精英</div></div></div>
      <div class="role-card" data-role="傲娇辣妹型"><div class="card-avatar avatar-rin">💢</div><div class="card-info"><div class="card-name">💢 凛</div><div class="card-desc">嘴硬心软的傲娇少女</div></div></div>
      <div class="role-card" data-role="甜美校花型"><div class="card-avatar avatar-tiantian">🍬</div><div class="card-info"><div class="card-name">🍬 甜甜</div><div class="card-desc">温柔甜美的校园女神</div></div></div>
      <div class="role-card" data-role="软萌可爱型"><div class="card-avatar avatar-dango">🍡</div><div class="card-info"><div class="card-name">🍡 团子</div><div class="card-desc">软萌胆小的小可爱</div></div></div>
      <div class="role-card" data-role="温柔贤淑型"><div class="card-avatar avatar-ruolan">🌿</div><div class="card-info"><div class="card-name">🌿 若兰</div><div class="card-desc">大姐姐般温柔体贴</div></div></div>
      <div class="role-card" data-role="元气少女型"><div class="card-avatar avatar-genki">☀️</div><div class="card-info"><div class="card-name">☀️ 葵</div><div class="card-desc">永远充满活力的阳光少女</div></div></div>
      <div class="role-card" data-role="清冷仙气型"><div class="card-avatar avatar-seisen">🌙</div><div class="card-info"><div class="card-name">🌙 清歌</div><div class="card-desc">如月光般清冷的仙女</div></div></div>
    </div>
  </div>
  <script>
    // 检查登录状态
    if (!localStorage.getItem('token')) {
      window.location.href = '/login';
    }

    document.querySelectorAll('.role-card').forEach(card => {
      card.addEventListener('click', () => {
        const roleType = card.dataset.role;
        window.location.href = `/chat?role=${encodeURIComponent(roleType)}`;
      });
    });
  </script>
</body>
</html>
