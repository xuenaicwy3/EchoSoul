<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心流 · 聊天</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- 新增游戏化样式 -->
  <link rel="stylesheet" href="/static/game.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="backBtn" class="back-btn" onclick="window.location.href='/home'">← 返回</button>
        <h2>💞 心流</h2>
      </div>
      <div class="add-role-area">
        <div class="custom-select-wrapper">
          <div class="custom-select" id="customSelect">
            <span id="customSelectText">+ 选择角色</span>
            <span class="arrow">▾</span>
          </div>
          <div class="custom-options" id="customOptions"></div>
        </div>
        <button id="addRoleBtn" title="添加会话">＋</button>
      </div>
      <div class="session-list" id="sessionList"></div>
      <!-- 在 session-list 之后，sidebar-footer 之前插入 -->
      <div class="story-entry" onclick="window.location.href='/story_page'">
        <span class="story-entry-icon">📖</span>
        <span class="story-entry-text">故事工坊</span>
        <span class="story-entry-desc">共创你的专属故事</span>
      </div>
      <div class="sidebar-footer"><small>点击会话切换，×删除</small></div>
    </aside>
    <main class="chat-main">
      <div class="chat-header">
        <span class="active-role-name">选择一个会话开始聊天</span>
        <span class="typing-hint" id="typingHint">对方正在输入...</span>
        <!-- ===== 在这里添加游戏中心按钮和皮肤显示 ===== -->
        <div class="header-right">
          <span id="skinIndicator" class="skin-indicator" style="display:none;">
            🎨 <span id="skinName"></span>
          </span>
          <a href="/game" class="game-btn">🎮 游戏中心</a>
        </div>
      </div>
      <div class="chat-area" id="chatArea"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="说点什么吧..." autofocus />
        <button id="sendBtn">发送</button>
      </div>
    </main>
  </div>
  <script>
    // ===================== 认证检查 =====================
    if (!localStorage.getItem('token')) {
      window.location.href = '/login';
    }

    const API_BASE = '';
    const USER_ID = localStorage.getItem('user_id');
    const TOKEN = localStorage.getItem('token');

    const STORAGE_KEY = 'echo_sessions_' + USER_ID;
    const ACTIVE_ROLE_KEY = 'echo_active_role_' + USER_ID;

    async function api(url, options = {}) {
      return fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${TOKEN}`,
          ...options.headers,
        }
      });
    }

    // ===================== 角色定义 =====================
    const ALL_ROLES = [
      { type: "日系动漫型", name: "小樱", emoji: "🌸", desc: "二次元少女" },
      { type: "高冷御姐型", name: "雪乃", emoji: "❄️", desc: "职场精英" },
      { type: "傲娇辣妹型", name: "凛", emoji: "💢", desc: "傲娇少女" },
      { type: "甜美校花型", name: "甜甜", emoji: "🍬", desc: "校园女神" },
      { type: "软萌可爱型", name: "团子", emoji: "🍡", desc: "软萌可爱" },
      { type: "温柔贤淑型", name: "若兰", emoji: "🌿", desc: "温柔姐姐" },
      { type: "元气少女型", name: "葵", emoji: "☀️", desc: "阳光少女" },
      { type: "清冷仙气型", name: "清歌", emoji: "🌙", desc: "清冷仙女" }
    ];

    // ===================== 会话管理 =====================
    let sessions = [];
    let activeSessionRole = null;

    function loadSessions() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) sessions = JSON.parse(saved);
      } catch (e) { sessions = []; }
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    loadSessions();

    // DOM 元素
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const sessionListEl = document.getElementById('sessionList');
    const chatHeaderName = document.querySelector('.active-role-name');
    const typingHint = document.getElementById('typingHint');
    const customSelect = document.getElementById('customSelect');
    const customSelectText = document.getElementById('customSelectText');
    const customOptions = document.getElementById('customOptions');
    const addRoleBtn = document.getElementById('addRoleBtn');
    let selectedRoleType = null;

    // ---------- 分页加载相关变量 ----------
    let oldestTimestamp = null;       // 已加载的最早消息时间戳
    let isLoadingMore = false;       // 是否正在加载更多
    let allLoaded = false;           // 是否已加载全部历史

    // 自定义下拉框
    function buildCustomOptions() {
      customOptions.innerHTML = '';
      ALL_ROLES.forEach(role => {
        const div = document.createElement('div');
        div.className = 'custom-option';
        div.dataset.roleType = role.type;
        div.textContent = `${role.emoji} ${role.name}`;
        div.addEventListener('click', () => {
          selectedRoleType = role.type;
          customSelectText.textContent = `${role.emoji} ${role.name}`;
          customOptions.classList.remove('show');
          customSelect.classList.remove('open');
          document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
          div.classList.add('selected');
        });
        customOptions.appendChild(div);
      });
    }
    buildCustomOptions();

    customSelect.addEventListener('click', (e) => {
      e.stopPropagation();
      customOptions.classList.toggle('show');
      customSelect.classList.toggle('open');
    });
    document.addEventListener('click', () => {
      customOptions.classList.remove('show');
      customSelect.classList.remove('open');
    });

    addRoleBtn.addEventListener('click', () => {
      if (!selectedRoleType) { alert('请先选择一个角色'); return; }
      createSession(selectedRoleType);
      selectedRoleType = null;
      customSelectText.textContent = '+ 选择角色';
      document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
    });

    // 渲染会话列表
    function renderSessionList() {
      sessionListEl.innerHTML = '';
      sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `session-item${activeSessionRole === session.roleType ? ' active' : ''}`;
        item.innerHTML = `
          <div class="session-avatar">${session.emoji}</div>
          <div class="session-info"><div class="session-name">${session.name}</div></div>
          <button class="delete-session" data-role="${session.roleType}">×</button>
        `;
        item.querySelector('.session-info').addEventListener('click', () => switchSession(session.roleType));
        item.querySelector('.delete-session').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSession(session.roleType);
        });
        sessionListEl.appendChild(item);
      });
    }

    function createSession(roleType) {
      const role = ALL_ROLES.find(r => r.type === roleType);
      if (!role) return;
      if (sessions.some(s => s.roleType === roleType)) {
        switchSession(roleType);
        return;
      }
      sessions.push({ roleType: role.type, name: role.name, emoji: role.emoji });
      saveSessions();
      switchSession(roleType);
      sendMessage(`[ROLE_SELECT]${roleType}`, true);
    }

    async function switchSession(roleType) {
      activeSessionRole = roleType;
      localStorage.setItem(ACTIVE_ROLE_KEY, roleType);
      const session = sessions.find(s => s.roleType === roleType);
      if (session) chatHeaderName.textContent = `与 ${session.name} 的对话`;

      // 重置分页状态
      oldestTimestamp = null;
      allLoaded = false;
      isLoadingMore = false;

      await loadHistory(roleType);
      renderSessionList();
    }

    async function deleteSession(roleType) {
      await api(`${API_BASE}/chat_history/${encodeURIComponent(roleType)}`, { method: 'DELETE' });
      sessions = sessions.filter(s => s.roleType !== roleType);
      saveSessions();
      if (activeSessionRole === roleType) {
        localStorage.removeItem(ACTIVE_ROLE_KEY);
        if (sessions.length > 0) {
          switchSession(sessions[0].roleType);
        } else {
          activeSessionRole = null;
          chatHeaderName.textContent = '选择一个会话开始聊天';
          chatArea.innerHTML = '';
        }
      }
      renderSessionList();
    }

    // ---------- 首次加载历史（最近50条） ----------
    async function loadHistory(roleType) {
      try {
        const res = await api(`${API_BASE}/chat_history/${encodeURIComponent(roleType)}`);
        if (!res.ok) {
          console.warn('加载历史失败，HTTP状态:', res.status);
          return;
        }

        const data = await res.json();
        const messages = Array.isArray(data) ? data : (data.history || []);
        console.log(`[loadHistory] 收到 ${messages.length} 条消息`, messages);

        chatArea.innerHTML = '';

        if (messages.length > 0) {
          // 记录最早消息的时间戳，用于后续加载更多
          oldestTimestamp = messages[0].timestamp;
        }

        messages.forEach((msg, index) => {
          try {
            if (!msg || typeof msg !== 'object') return;
            const sender = (msg.sender || 'ai').toLowerCase();
            addMessage(sender, msg.message || '', formatTime(msg.timestamp));
          } catch (e) {
            console.error(`[loadHistory] 第 ${index} 条消息渲染失败`, msg, e);
          }
        });

        // 如果返回数量少于50，说明没有更多了
        allLoaded = messages.length < 50;
        chatArea.scrollTop = chatArea.scrollHeight;
        console.log('[loadHistory] 历史记录加载完成，最早时间:', oldestTimestamp);
      } catch (e) {
        console.error('加载历史记录异常:', e);
      }
    }

    // ---------- 滚动加载更多 ----------
    async function loadMoreHistory(roleType) {
      if (isLoadingMore || allLoaded) return;
      if (!oldestTimestamp) return;

      isLoadingMore = true;
      try {
        const url = `${API_BASE}/chat_history/${encodeURIComponent(roleType)}?before=${encodeURIComponent(oldestTimestamp)}`;
        const res = await api(url);
        if (!res.ok) {
          console.warn('加载更多历史失败');
          return;
        }

        const data = await res.json();
        const messages = Array.isArray(data) ? data : (data.history || []);
        console.log(`[loadMore] 收到 ${messages.length} 条更早消息`);

        if (messages.length === 0) {
          allLoaded = true;
          return;
        }

        // 记录滚动条当前位置（插入前的高度）
        const prevScrollHeight = chatArea.scrollHeight;

        // 将更早的消息插入到最前面
        messages.reverse().forEach(msg => {
          const sender = (msg.sender || 'ai').toLowerCase();
          addMessageToTop(sender, msg.message || '', formatTime(msg.timestamp));
        });

        // 更新最早时间戳
        oldestTimestamp = messages[0].timestamp;

        // 如果返回数量少于50，说明没有更多了
        if (messages.length < 50) allLoaded = true;

        // 保持滚动位置不变
        chatArea.scrollTop = chatArea.scrollHeight - prevScrollHeight;
        console.log('[loadMore] 加载更多完成，当前最早时间:', oldestTimestamp);
      } catch (e) {
        console.error('加载更多历史异常:', e);
      } finally {
        isLoadingMore = false;
      }
    }

    // 将消息插入到聊天区域顶部（用于加载更早的消息）
    function addMessageToTop(type, text, time) {
      const session = sessions.find(s => s.roleType === activeSessionRole);
      const avatarEmoji = type === 'ai' ? (session?.emoji || '🌸') : '😊';
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = `
        <div class="avatar">${avatarEmoji}</div>
        <div class="bubble"><div>${escapeHtml(text)}</div><div class="time">${time}</div></div>
      `;
      // 插入到第一个子元素之前
      chatArea.insertBefore(msgDiv, chatArea.firstChild);
    }

    // 滚动监听
    chatArea.addEventListener('scroll', () => {
      if (chatArea.scrollTop <= 50) {  // 距离顶部50px时触发
        if (activeSessionRole) {
          loadMoreHistory(activeSessionRole);
        }
      }
    });

    // ===================== 发送消息（保持不变） =====================
    async function sendMessage(message, isSystem = false) {
      if (!activeSessionRole) { alert('请先选择一个会话'); return; }
      if (!isSystem) addMessage('user', message, formatTime());

      typingHint.style.setProperty('opacity', '1', 'important');

      try {
        const res = await api(`${API_BASE}/chat`, {
          method: 'POST',
          body: JSON.stringify({ message, role_type: activeSessionRole })
        });
        const data = await res.json();
        const taskId = data.task_id;

        // 轮询结果
        let replyData = null;
        let errorMsg = null;
        for (let i = 0; i < 60; i++) {
          await new Promise(r => setTimeout(r, 200));
          try {
              const pollRes = await api(`${API_BASE}/chat/result/${taskId}`);
              const pollData = await pollRes.json();

              if (pollData.reply) {
                  replyData = pollData;
                  break;
              }
              if (pollData.error) {
                  errorMsg = pollData.error;
                  break;
              }
              // 如果是 { status: "pending" }，继续轮询
          } catch (err) {
              console.error('轮询请求异常', err);
              // 网络异常时继续重试
          }
        }

        typingHint.style.setProperty('opacity', '0', 'important');

        if (replyData) {
          addMessage('ai', replyData.reply, formatTime());
        } else {
          addMessage('ai', '😢 AI 回复超时，请稍后再试~', formatTime());
        }
      } catch (err) {
        typingHint.style.setProperty('opacity', '0', 'important');
        addMessage('ai', '😢 网络出小差了，请稍后再试~', formatTime());
      }
    }

    function sendUserMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      if (!activeSessionRole) { alert('请先选择一个会话'); return; }
      userInput.value = '';
      sendMessage(text);
    }

    function addMessage(type, text, time) {
      const session = sessions.find(s => s.roleType === activeSessionRole);
      const avatarEmoji = type === 'ai' ? (session?.emoji || '🌸') : '😊';
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = `
        <div class="avatar">${avatarEmoji}</div>
        <div class="bubble"><div>${escapeHtml(text)}</div><div class="time">${time}</div></div>
      `;
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function formatTime(timestamp) {
      if (timestamp) {
        const date = new Date(timestamp);
        return `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
      }
      const now = new Date();
      return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // 事件绑定
    sendBtn.addEventListener('click', sendUserMessage);
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendUserMessage(); });

    // ===================== 页面初始化 =====================
    const urlParams = new URLSearchParams(window.location.search);
    const initialRole = urlParams.get('role');
    const lastActiveRole = localStorage.getItem(ACTIVE_ROLE_KEY);

    if (initialRole) {
      createSession(initialRole);
    } else if (lastActiveRole && sessions.some(s => s.roleType === lastActiveRole)) {
      switchSession(lastActiveRole);
    } else if (sessions.length > 0) {
      switchSession(sessions[0].roleType);
    } else {
      renderSessionList();
    }
  </script>
</body>
</html>
