<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心流 · 登录</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">💞 心流 EchoSoul</h1>
      <p class="auth-subtitle">登录你的账号</p>
      <div id="error" class="auth-error" style="display:none;"></div>
      <div class="auth-form">
        <input type="text" id="username" placeholder="用户名" />
        <input type="password" id="password" placeholder="密码" />
        <button id="submitBtn">登 录</button>
      </div>
      <div class="auth-toggle">
        <span>还没有账号？</span>
        <a href="/register">立即注册</a>
      </div>
    </div>
  </div>
  <script>
    const API_BASE = '';
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) {
        document.getElementById('error').textContent = '用户名和密码不能为空';
        document.getElementById('error').style.display = 'block';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('error').textContent = data.detail || '登录失败';
          document.getElementById('error').style.display = 'block';
          return;
        }
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user_id', data.user_id);
        window.location.href = '/home';
      } catch (err) {
        document.getElementById('error').textContent = '网络错误，请稍后重试';
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
