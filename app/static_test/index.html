<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心流 · 虚拟伴侣</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- ========== 视图1：首页 ========== -->
  <div id="homeView" class="view">
    <div class="home-container">
      <h1 class="home-title">✨ AI 虚拟陪伴 ✨</h1>
      <p class="home-subtitle">选择一位角色，开启属于你们的温暖对话</p>
      <div class="role-cards" id="roleCards"></div>
    </div>
  </div>

  <!-- ========== 视图2：聊天界面 ========== -->
  <div id="chatView" class="view" style="display:none;">
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <button id="backBtn" class="back-btn">← 返回</button>
          <h2>💞 心流</h2>
          <button id="newChatBtn" title="新建对话">＋</button>
        </div>
        <div class="role-list" id="roleList"></div>
        <div class="sidebar-footer">
          <small>点击角色开启新对话</small>
        </div>
      </aside>
      <main class="chat-main">
        <div class="chat-header" id="chatHeader">
          <span class="active-role-name">选择角色开始聊天</span>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="input-area">
          <input type="text" id="userInput" placeholder="说点什么吧..." autofocus />
          <button id="sendBtn">发送</button>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
